<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Aprovação de Layout — Copos, Potes e Baldes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="panel">
    <h1>Aprovação de Layout</h1>
    <p class="subtitle">Preencha os dados e gere a imagem 1920×1080</p>

    <div class="field">
      <label for="cliente">Cliente</label>
      <input type="text" id="cliente" placeholder="Ex: Apex Brasil">
    </div>

    <div class="field">
      <label for="representante">Representante</label>
      <input type="text" id="representante" placeholder="Ex: Ancoraggio">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="tipo">Embalagem</label>
        <select id="tipo">
          <option value="COPO">Copo</option>
          <option value="POTE">Pote</option>
          <option value="BALDE">Balde</option>
        </select>
      </div>

      <div class="field field-ml">
        <label for="ml">Capacidade (ml)</label>
        <input type="number" id="ml" placeholder="100" min="0">
      </div>
    </div>

    <div class="field">
      <label>Arte Aberta (planificada)</label>
      <div class="dropzone" id="dropAberta">
        <span class="dz-text">Clique ou arraste a imagem aqui</span>
        <img class="dz-thumb" id="thumbAberta" hidden>
      </div>
      <input type="file" id="fileAberta" accept="image/*" hidden>
    </div>

    <div class="field">
      <label>Arte Mockup (simulação 3D)</label>
      <div class="dropzone" id="dropMockup">
        <span class="dz-text">Clique ou arraste a imagem aqui</span>
        <img class="dz-thumb" id="thumbMockup" hidden>
      </div>
      <input type="file" id="fileMockup" accept="image/*" hidden>
    </div>

    <div class="field">
      <label>Arte Mockup 2 (opcional)</label>
      <div class="dropzone" id="dropMockup2">
        <span class="dz-text">Clique ou arraste a imagem aqui</span>
        <img class="dz-thumb" id="thumbMockup2" hidden>
      </div>
      <input type="file" id="fileMockup2" accept="image/*" hidden>
    </div>

    <button id="btnGerar" class="btn-primary">Baixar Imagem (PNG)</button>
    <p class="hint">A pré-visualização ao lado já mostra o resultado final em tempo real.</p>
  </aside>

  <main class="preview-area">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1920" height="1080"></canvas>
    </div>
  </main>

</div>

  function loadImageFile(file, onLoaded) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => onLoaded(img, e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setupDropzone(zoneId, inputId, thumbId, onImage) {
    const zone = $(zoneId);
    const input = $(inputId);
    const thumb = $(thumbId);
    const text = zone.querySelector('.dz-text');

    zone.addEventListener('click', () => input.click());

    input.addEventListener('change', () => {
      if (input.files[0]) handleFile(input.files[0]);
    });

    ['dragover', 'dragenter'].forEach(evt =>
      zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(evt =>
      zone.addEventListener(evt, (e) => { e.preventDefault(); zone.classList.remove('dragover'); })
    );
    zone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      loadImageFile(file, (img, dataUrl) => {
        thumb.src = dataUrl;
        thumb.hidden = false;
        text.hidden = true;
        onImage(img, dataUrl);
        draw();
      });
    }
  }

  setupDropzone('dropAberta', 'fileAberta', 'thumbAberta', (img) => { state.imgAberta = img; });

  setupDropzone('dropMockup2', 'fileMockup2', 'thumbMockup2', (img) => { state.imgMockup2 = img; });

  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let cy = y;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxWidth && line !== '') {
        ctx.fillText(line.trim(), x, cy);
        line = words[i] + ' ';
        cy += lineHeight;
      } else {
        line = test;
      }
    }
    ctx.fillText(line.trim(), x, cy);
    return cy + lineHeight;
  }

  function drawImageContain(img, x, y, w, h) {
    const ratio = Math.min(w / img.width, h / img.height);
    const dw = img.width * ratio;
    const dh = img.height * ratio;
    const dx = x + (w - dw) / 2;
    const dy = y + (h - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCard(x, y, w, h, r) {
    ctx.save();
    ctx.shadowColor = 'rgba(10, 32, 47, 0.10)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#ffffff';
    roundRectPath(x, y, w, h, r);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(10, 32, 47, 0.08)';
    ctx.lineWidth = 1.5;
    roundRectPath(x, y, w, h, r);
    ctx.stroke();
    ctx.restore();
  }

  function drawImageZoomFill(img, x, y, size, zoom) {
    const ratio = Math.max(size / img.width, size / img.height) * zoom;
    const dw = img.width * ratio;
    const dh = img.height * ratio;
    const dx = x + (size - dw) / 2;
    const dy = y + (size - dh) / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, size, size);
    ctx.clip();
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function drawPlaceholder(x, y, w, h, label) {
    ctx.save();
    ctx.strokeStyle = COLORS.border;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    ctx.fillStyle = COLORS.muted;
    ctx.font = '28px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.restore();
  }

  function drawBar(y, thickness) {
    ctx.save();
    ctx.fillStyle = COLORS.blue;
    ctx.fillRect(0, y, W, thickness);
    ctx.restore();
  }

  function drawLogoFallback(x, y, w, h) {
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.blue;
    ctx.font = 'italic bold 46px Arial';
    const text = 'pluspack';
    ctx.fillText(text, x, y + 46);
    const tw = ctx.measureText(text).width;
    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = COLORS.muted;
    ctx.fillText('EMBALAGENS', x + 2, y + 70);
    ctx.font = 'bold 14px Arial';
    ctx.fillText('®', x + tw + 4, y + 20);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const marginX = 60;
    const contentW = W - marginX * 2;
    const cardR = 22;

    const barThickness = 20;
    drawBar(0, barThickness);
    drawBar(H - barThickness, barThickness);

    const kickerText = 'APROVAÇÃO DE LAYOUT';
    ctx.font = 'bold 20px Arial';
    const kickerW = ctx.measureText(kickerText).width;
    const kickerPad = 18, kickerH = 36, kickerX = marginX, kickerY = 32;
    roundRectPath(kickerX, kickerY, kickerW + kickerPad * 2, kickerH, kickerH / 2);
    ctx.fillStyle = COLORS.blue;
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(kickerText, kickerX + kickerPad, kickerY + kickerH / 2 + 1);

    const headerY = 96;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = COLORS.text;
    ctx.font = '900 64px Arial';
    const tipoLabel = state.tipo || 'COPO';
    ctx.fillText(tipoLabel, marginX, headerY + 55);
    const tipoW = ctx.measureText(tipoLabel).width;

    const lineX1 = marginX + tipoW + 24;
    const lineX2 = lineX1 + 60;
    ctx.strokeStyle = COLORS.text;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lineX1, headerY + 30);
    ctx.lineTo(lineX2, headerY + 30);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(lineX1 + (lineX2 - lineX1) / 2, headerY + 30, 7, 0, Math.PI * 2);
    ctx.fill();

    const mlLabel = (state.ml ? state.ml : '---') + 'ml';
    ctx.font = '900 64px Arial';
    ctx.fillText(mlLabel, lineX2 + 24, headerY + 55);

    const logoW = 340, logoH = 110;
    const logoX = W - marginX - logoW, logoY = headerY - 15;
    if (logoImg.complete && logoImg.naturalWidth) {
      drawImageContain(logoImg, logoX, logoY, logoW, logoH);
    } else {
      drawLogoFallback(logoX, logoY + 10, logoW, logoH);
    }

    const rowY = 210, rowH = 456;
    const artW = contentW * 0.58;
    const legendX = marginX + artW + 40;
    const legendW = contentW - artW - 40;

    drawCard(marginX, rowY, artW, rowH, cardR);
    ctx.save();
    roundRectPath(marginX, rowY, artW, rowH, cardR);
    ctx.clip();
    if (state.imgAberta) {
      drawImageContain(state.imgAberta, marginX + 24, rowY + 24, artW - 48, rowH - 48);
    } else {
      drawPlaceholder(marginX + 24, rowY + 24, artW - 48, rowH - 48, 'ARTE ABERTA (PLANIFICADA)');
    }
    ctx.restore();

    ctx.font = '18px Arial';
    ctx.fillStyle = COLORS.muted;
    ctx.fillText('Simulação', legendX, rowY + 22);
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = COLORS.text;
    ctx.fillText('*Meramente Ilustrativa', legendX, rowY + 44);

    ctx.strokeStyle = COLORS.blue;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(legendX, rowY + 56);
    ctx.lineTo(legendX + 90, rowY + 56);
    ctx.stroke();

    ctx.font = '17px Arial';
    ctx.fillStyle = COLORS.muted;
    ctx.fillText('Cliente: ' + (state.cliente || '-'), legendX, rowY + 80);
    ctx.fillText('Representante: ' + (state.representante || '-'), legendX, rowY + 102);

    const mockR = 18;
    const mockGap = 20;
    const mockAvailY = rowY + 116;
    const mockAvailH = rowH - 116;
    const mockSize = mockAvailH;
    const mockImgs = state.imgMockup2 ? [state.imgMockup, state.imgMockup2] : [state.imgMockup];
    const totalMocksW = mockImgs.length * mockSize + (mockImgs.length - 1) * mockGap;
    const mockGroupX = legendX + (legendW - totalMocksW) / 2;
    mockImgs.forEach((img, i) => {
      const mx = mockGroupX + i * (mockSize + mockGap);
      drawCard(mx, mockAvailY, mockSize, mockSize, mockR);
      ctx.save();
      roundRectPath(mx, mockAvailY, mockSize, mockSize, mockR);
      ctx.clip();
      if (img) {
        drawImageZoomFill(img, mx, mockAvailY, mockSize, 1.35);
      } else {
        drawPlaceholder(mx, mockAvailY, mockSize, mockSize, 'ARTE MOCKUP');
      }
      ctx.restore();
    });

    const botY = rowY + rowH + 36, botH = 340;
    const gap = 50;
    const col1W = contentW * 0.28;
    const col2W = contentW - col1W - gap;
    const col1X = marginX;
    const col2X = col1X + col1W + gap;

    drawCard(col1X, botY, col1W, botH, cardR);
    const boxH = 40;
    ctx.save();
    roundRectPath(col1X, botY, col1W, botH, cardR);
    ctx.clip();
    ctx.fillStyle = COLORS.blue;
    ctx.fillRect(col1X, botY, col1W, boxH);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('IMPORTANTE', col1X + 22, botY + boxH - 13);

    let c1y = botY + boxH + 30;
    const importantLines = [
      'ENVIAR SEU ARQUIVO EM PDF/X-1A',
      'RESOLUÇÃO MÍNIMA 300 DPI',
      'USAR AS CORES DA PALETA CMYK. CASO TENHA PANTONE, NOS INFORME O CÓDIGO'
    ];
    importantLines.forEach((l) => {
      ctx.fillStyle = COLORS.text;
      ctx.font = '18px Arial';
      c1y = wrapText(l, col1X + 22, c1y, col1W - 44, 23);
      c1y += 8;
    });
    ctx.font = 'italic 15px Arial';
    ctx.fillStyle = COLORS.muted;
    wrapText('*O mockup 3D é meramente ilustrativo e não representa o material final da embalagem. As cores exibidas podem variar de acordo com a calibração e as configurações do monitor.', col1X + 22, c1y, col1W - 44, 20);

    drawCard(col2X, botY, col2W, botH, cardR);
    let ly = botY + 26;
    const legendItems = [
      {
        title: 'SEGURANÇA',
        swatch: (x, y, w, h) => {
          ctx.strokeStyle = COLORS.text;
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 6]);
          roundRectPath(x, y, w, h, 4);
          ctx.stroke();
          ctx.setLineDash([]);
        },
        text: 'As informações importantes (textos e imagens) devem ser recuadas para dentro da margem de segurança, para não serem danificadas em caso de violação do corte.'
      },
      {
        title: 'CORTE',
        swatch: (x, y, w, h) => {
          ctx.strokeStyle = COLORS.cutRed;
          ctx.lineWidth = 3;
          roundRectPath(x, y, w, h, 4);
          ctx.stroke();
        },
        text: 'Não utilizar a linha de corte como parâmetro para inserir informações, tendo em vista que o corte pode variar.'
      },
      {
        title: 'SANGRIA',
        swatch: (x, y, w, h) => {
          ctx.fillStyle = COLORS.bleedOrange;
          roundRectPath(x, y, w, h, 4);
          ctx.fill();
        },
        text: 'Encaixe o fundo em toda área da sangria para evitar filetes brancos em sua arte.'
      }
    ];

    legendItems.forEach((item) => {
      const swW = 70, swH = 26;
      item.swatch(col2X + 24, ly, swW, swH);
      ctx.fillStyle = COLORS.text;
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(item.title, col2X + 24 + swW + 16, ly + swH - 4);
      ly += swH + 26;
      ctx.font = '18px Arial';
      ctx.fillStyle = COLORS.muted;
      ly = wrapText(item.text, col2X + 24, ly, col2W - 48, 24);
      ly += 20;
    });
  }

  $('btnGerar').addEventListener('click', () => {
    draw();
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const nomeCliente = (state.cliente || 'cliente').trim().replace(/\s+/g, '_');
      const tipo = (state.tipo || 'embalagem').toLowerCase();
      const ml = state.ml || '0';
      a.href = url;
      a.download = `Aprovacao_${nomeCliente}_${tipo}_${ml}ml.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png', 1.0);
  });

  draw();
})();
</script>
</body>
</html>
